<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="C.Verse — CV neon monogram">
  <defs>
    <linearGradient id="cvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#C084FF"/>
    </linearGradient>
    <filter id="cvGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge bg -->
  <rect width="32" height="32" rx="7" fill="#07080E"/>
  <rect x="1" y="1" width="30" height="30" rx="6.2" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

  <!-- CV monogram: cyan C arc cradling a cyan->purple V -->
  <g filter="url(#cvGlow)" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 8.8 A 8 8 0 1 0 20 23.2" stroke="#00F0FF"/>
    <path d="M 13.2 11.5 L 17 22 L 20.8 11.5" stroke="url(#cvGrad)"/>
  </g>
</svg>
