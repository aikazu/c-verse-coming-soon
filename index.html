<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#171717" />
  <meta name="apple-mobile-web-app-title" content="C.Verse" />
  <meta name="application-name" content="CreatorVerse" />

  <title>CreatorVerse — Segera hadir</title>
  <meta name="description" content="C.Card fisik edisi terbatas dari kreator di C.Verse. Situs CreatorVerse segera hadir." />
  <meta name="author" content="CreatorVerse" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://c-verse.co/" />

  <!-- Favicons: CreatorVerse symbol, black on lime, generated by scripts/brand-assets.py -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph. Absolute image URL so WhatsApp, X, and Discord crawlers can fetch it without page context. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CreatorVerse" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:url" content="https://c-verse.co/" />
  <meta property="og:title" content="CreatorVerse — Segera hadir" />
  <meta property="og:description" content="C.Card fisik edisi terbatas dari kreator di C.Verse. Situs CreatorVerse segera hadir." />
  <meta property="og:image" content="https://c-verse.co/og-image.png" />
  <meta property="og:image:secure_url" content="https://c-verse.co/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logo CreatorVerse, hitam di atas lime" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CreatorVerse — Segera hadir" />
  <meta name="twitter:description" content="C.Card fisik edisi terbatas dari kreator di C.Verse. Situs CreatorVerse segera hadir." />
  <meta name="twitter:image" content="https://c-verse.co/og-image.png" />
  <meta name="twitter:image:alt" content="Logo CreatorVerse, hitam di atas lime" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <audio id="bgMusic" loop preload="auto" crossorigin="anonymous" playsinline>
    <source src="/audio/ambient.ogg" type="audio/ogg">
    <source src="/audio/ambient.mp3" type="audio/mpeg">
  </audio>

  <header class="topbar">
    <a class="topbar__brand" href="/" aria-label="CreatorVerse">
      <span class="brand-symbol" aria-hidden="true"></span>
    </a>
    <p class="topbar__place">Jakarta <span class="topbar__sep" aria-hidden="true">·</span> <time id="clock">00:00:00 WIB</time></p>
    <p class="topbar__status">Segera hadir</p>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__content">
        <h1 id="hero-title" class="hero__lockup">
          <span class="brand-logo" aria-hidden="true"></span>
          <span class="sr-only">CreatorVerse</span>
        </h1>
        <p class="hero__headline">Karya favoritmu. Jadi koleksimu.</p>
        <p class="hero__lead">C.Card fisik edisi terbatas dari kreator di C.Verse. Situs kami segera hadir.</p>
      </div>

      <footer class="hero__footer">
        <span>© 2026 CreatorVerse</span>
        <span class="sep" aria-hidden="true">·</span>
        <button type="button" id="soundToggle" aria-pressed="true">Suara: aktif</button>
      </footer>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
